<section>
  <div [total]="total" app-saldo-card></div>
  <form>
    <h2>Novo lançamento</h2>
    <input type="number" [(ngModel)]="operacao.valor" name="valor" />
    <input type="text" name="titulo" [(ngModel)]="operacao.titulo" />
    <app-operacao-saldo-button (click)="adicionar()" texto="adicionar" icon="add" />
    <app-operacao-saldo-button (click)="retirar()" texto="subtrair" icon="remove" />
  </form>
</section>

<section>
  <h2>Histórico do dia</h2>
  <app-historico-dia />
</section>
