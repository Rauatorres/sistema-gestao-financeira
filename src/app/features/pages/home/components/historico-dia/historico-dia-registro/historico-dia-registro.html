<span class="area-valor-operacao" [class.negativo]="registro().valor < 0">
  <span>R$</span>
  <span>{{ registro().valor | valorOperacao }}</span>
</span>
<span class="titulo-operacao">
  @if (tituloModoEditar()) {
    <input
      class="titulo-input"
      type="text"
      (blur)="salvarTitulo()"
      #editarTitulo
      [value]="registro().titulo"
    />
  } @else {
    <span (click)="editarTitulo()">
      {{ registro().titulo != '' ? registro().titulo : 'nenhum' }}
    </span>
    <!-- <input type="text" /> -->
  }
</span>
<span class="area-botao-deletar">
  <button type="button" (click)="deletar()" app-botao-deletar></button>
</span>
