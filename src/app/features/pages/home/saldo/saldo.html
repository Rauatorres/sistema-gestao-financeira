<section class="saldo-section">
  <div [total]="total" app-saldo-card></div>
  <form class="lancamento-form">
    <h2 class="title">Novo lançamento</h2>
    <div class="input-area">
      <div class="input-box saldo-input">
        <span class="indicador-moeda-input">R$</span>
        <input
          class="valor-input"
          type="number"
          /* min="0.01"
          step="0.01" */
          [(ngModel)]="valorString"
          (ngModelChange)="aoMudarValor($event)"
          /* (change)="onchangeValor()" */
          name="valor"
          /* app-input */
          #valorInput
        />

        <!-- <input
          type="text"
          [value]="valorString"
          (input)="aoMudarValor($any($event.target).value)"
          name="valor"
          app-input
        />
        -->
      </div>
      <input
        class="saldo-input"
        type="text"
        name="titulo"
        [(ngModel)]="operacao.titulo"
        app-input
      />
    </div>
    <div class="buttons-area">
      <button
        styleType="primary"
        app-operacao-button
        (click)="adicionar()"
        texto="adicionar"
        icon="add"
      ></button>
      <button
        styleType="danger"
        app-operacao-button
        (click)="retirar()"
        texto="subtrair"
        icon="remove"
      ></button>
    </div>
  </form>
</section>

<section>
  <h2 class="title section-title">Histórico do dia</h2>
  <div app-historico-dia></div>
</section>
