<section>
  <h2 class="section-title">Histórico de transações</h2>
  <form class="selecionar-data-form">
    <h3 class="form-title">Por data</h3>
    <div class="input-container">
      <label for="dia">
        <p class="input-title">Dia</p>
        <input
          class="selecionar-data-input"
          id="dia"
          (input)="aoDigitarDia($event)"
          type="number"
          max="31"
          min="1"
          name="dia"
          app-input
          [placeholder]="placeholder.dia"
        />
      </label>
      <label for="mes">
        <p class="input-title">Mês</p>
        <input
          class="selecionar-data-input"
          id="mes"
          (input)="aoDigitarMes($event)"
          type="number"
          max="12"
          min="1"
          name="mes"
          app-input
          [placeholder]="placeholder.mes"
        />
      </label>
      <label for="ano">
        <p class="input-title">Ano</p>
        <input
          class="selecionar-data-input ano"
          [(ngModel)]="dataSelecionada().ano"
          /* (ngModelChange)="aoDigitarAno($event)" */
          id="anoano"
          name="ano"
          type="number"
          min="2026"
          app-input
          [placeholder]="placeholder.ano"
        />
      </label>
    </div>
  </form>
</section>
<section>
  <div>
    <div class="linha-tabela-historico area-titulo-tabela-historico">
      <div class="celula-tabela-historico">Valor (R$)</div>
      <div class="celula-tabela-historico">Título</div>
      <div class="celula-tabela-historico">Data</div>
    </div>
    <ul class="lista-registros">
      @for (registro of registrosFiltrados(); track registro.id) {
        <li class="linha-tabela-historico">
          <span class="celula-tabela-historico" [class.negativo]="registro.valor < 0">{{
            registro.valor | valorOperacao
          }}</span>
          <span class="celula-tabela-historico titulo-do-registro">{{ registro.titulo }}</span>
          <span class="celula-tabela-historico data-do-registro">{{
            registro.data | dateToString
          }}</span>
        </li>
      }
    </ul>
  </div>
  <button class="mostrar-mais-button">
    Mostrar mais <mat-icon class="icon">arrow_drop_down</mat-icon>
  </button>
</section>
