<span class="area-valor-operacao" [class.negativo]="registro().valor < 0">
  <span>R$</span>
  <span>{{ registro().valor | valorOperacao }}</span>
</span>
<span class="titulo-operacao-area">
  @if (tituloModoEditar()) {
    <input
      class="titulo-input"
      type="text"
      (blur)="salvarTitulo()"
      #editarTitulo
      [value]="registro().titulo"
    />
  } @else {
    <span
      class="titulo-operacao"
      (click)="editarTitulo()"
      (mouseenter)="isTituloOperacaoHover.set(true)"
      (mouseleave)="isTituloOperacaoHover.set(false)"
    >
      {{ registro().titulo != '' ? registro().titulo : 'nenhum' }}
    </span>
    <mat-icon [style.display]="isTituloOperacaoHover() ? 'block' : 'none'" class="editar-icon"
      >edit</mat-icon
    >
  }
</span>
<span class="area-botao-deletar">
  <button type="button" (click)="deletar()" app-botao-deletar></button>
</span>
