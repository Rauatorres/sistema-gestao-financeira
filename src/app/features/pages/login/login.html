<section class="main-section">
  <form class="login-form" [formGroup]="form" (submit)="onSubmit()">
    <h1 class="form-title">Bem vindo ao seu app de gestão financeira</h1>
    <div class="input-area">
      <label for="nome">
        <h2 class="input-title">Nome de usuário</h2>
        <div class="input-box">
          <input
            app-input
            type="text"
            name="senha"
            id="nome"
            formControlName="nome"
            placeholder="nome"
          />
          <mat-icon class="input-icon">person</mat-icon>
        </div>
      </label>
      <div>
        @if (isNomeInvalido) {
          <!-- <p class="invalid-message">O campo 'Nome' não pode estar vazio</p> -->
          <p appInvalidMessage>O campo 'Nome' não pode estar vazio</p>
        }
      </div>
    </div>
    <div class="input-area">
      <label for="senha">
        <h2 class="input-title">Senha</h2>
        <div class="input-box">
          <input
            app-input
            type="password"
            name="senha"
            id="senha"
            placeholder="senha"
            formControlName="senha"
          />
          <mat-icon class="input-icon">lock</mat-icon>
        </div>
      </label>
      <div>
        @if (isSenhaInvalida) {
          <p appInvalidMessage>O campo 'Senha' não pode estar vazio</p>
        }
      </div>
    </div>
    <div>
      <p appInvalidMessage>*o nome de usuário ou senha está incorreto</p>
    </div>

    <button class="button main" type="submit">Login</button>
    <a class="button normal" routerLink="/cadastrar">Cadastrar</a>
  </form>
</section>
