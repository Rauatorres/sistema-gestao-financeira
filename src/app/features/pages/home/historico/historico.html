<section>
  <h2 class="section-title">Histórico de transações</h2>
  <form>
    <h3>Por data</h3>
    <div class="input-container">
      <label for="dia">
        <p>Dia</p>
        <input
          id="dia"
          (input)="aoDigitarDia($event)"
          type="number"
          max="31"
          min="1"
          name="dia"
          app-input
          [placeholder]="placeholder.dia"
        />
      </label>
      <label for="mes">
        <p>Mês</p>
        <input
          id="mes"
          (input)="aoDigitarMes($event)"
          type="number"
          max="12"
          min="1"
          name="mes"
          app-input
          [placeholder]="placeholder.mes"
        />
      </label>
      <label for="ano">
        <p>Ano</p>
        <input
          [(ngModel)]="dataSelecionada().ano"
          /* (ngModelChange)="aoDigitarAno($event)" */
          id="anoano"
          name="ano"
          type="number"
          min="2026"
          app-input
          [placeholder]="placeholder.ano"
        />
      </label>
    </div>
  </form>

</section>
<section>
  <div>
    <div class="linha-tabela-historico area-titulo-tabela-historico">
      <div class="celula-tabela-historico">Valor (R$)</div>
      <div class="celula-tabela-historico">Título</div>
      <div class="celula-tabela-historico">Data</div>
    </div>
    <ul class="lista-registros">
      @for (registro of registrosFiltrados(); track registro.id) {
        <li class="linha-tabela-historico">
          <span class="celula-tabela-historico">{{ registro.valor }}</span>
          <span class="celula-tabela-historico">{{ registro.titulo }}</span>
          <span class="celula-tabela-historico">{{ registro.data | dateToString }}</span>
        </li>
      }
    </ul>
    <button>Mostrar mais <mat-icon>arrow_drop_down</mat-icon></button>
  </div>
</section>
