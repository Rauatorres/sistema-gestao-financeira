<section class="main-section">
  <form class="login-form" [formGroup]="form" (submit)="onSubmit()">
    <h1>Bem vindo ao seu app de gestão financeira</h1>
    <div>
      <label for="nome">
        <h2 class="input-title">Nome de usuário</h2>
        <div>
          <input
            app-input
            type="text"
            name="senha"
            id="nome"
            formControlName="nome"
            placeholder="nome"
          />
          <mat-icon>person</mat-icon>
        </div>
      </label>
      <div>
        @if (isNomeInvalido) {
          <p class="invalid-message">O campo 'Nome' não pode estar vazio</p>
        }
      </div>
    </div>
    <div>
      <label for="senha">
        <h2 class="input-title">Senha</h2>
        <div>
          <input
            app-input
            type="password"
            name="senha"
            id="senha"
            placeholder="senha"
            formControlName="senha"
          />
          <mat-icon>lock</mat-icon>
        </div>
      </label>
      <div>
        @if (isSenhaInvalida) {
          <p class="invalid-message">O campo 'Senha' não pode estar vazio</p>
        }
      </div>
    </div>
    <div>
      <p class="invalid-message">*o nome de usuário ou senha está incorreto</p>
    </div>

    <button class="button" type="submit">Login</button>
    <a class="button" routerLink="/cadastrar">Cadastrar</a>
  </form>
</section>
