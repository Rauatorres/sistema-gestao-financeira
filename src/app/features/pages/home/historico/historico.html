<section>
  <h2 class="section-title">Histórico de transações</h2>
  <form>
    <h3>Por data</h3>
    <div class="input-container">
      <label for="">
        <p>Dia</p>
        <input type="number" max="31" min="1" app-input />
      </label>
      <label for="">
        <p>Mês</p>
        <input type="number" max="12" min="1" app-input />
      </label>
      <label for="">
        <p>Ano</p>
        <input type="number" min="2026" app-input />
      </label>
    </div>
  </form>
  <form>
    <h3>Filtrar</h3>
    <div class="input-container">
      <label for="">
        <input type="radio" name="filtrar" id="" value="todos" checked />
        <p>Todos</p>
      </label>
      <label for="">
        <input type="radio" name="filtrar" id="" value="dia" />
        <p>Apenas o dia</p>
      </label>
      <label for="">
        <input type="radio" name="filtrar" id="" value="mes" />
        <p>Apenas o mês</p>
      </label>
    </div>
  </form>
</section>
<section>
  <div>
    <div class="linha-tabela-historico area-titulo-tabela-historico">
      <div class="celula-tabela-historico">Valor (R$)</div>
      <div class="celula-tabela-historico">Título</div>
      <div class="celula-tabela-historico">Data</div>
    </div>
    <ul class="lista-registros">
      @for (registro of registros; track registro.id) {
        <li class="linha-tabela-historico">
          <span class="celula-tabela-historico">{{ registro.valor }}</span>
          <span class="celula-tabela-historico">{{ registro.titulo }}</span>
          <span class="celula-tabela-historico">{{ registro.data | dateToString }}</span>
        </li>
      }
    </ul>
    <button>Mostrar mais <mat-icon>arrow_drop_down</mat-icon></button>
  </div>
</section>
